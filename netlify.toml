[build]
  command = "pnpm build"
  publish = "apps/demo-crm/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.video-worker-background]
  included_files = ["node_modules/@ffmpeg-installer/linux-x64/ffmpeg"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
